<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Lounge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-bg"></div>
            <div class="header-content">
                <div class="logo">
                    <span class="logo-suit">♠</span>
                    <h1>Poker Lounge</h1>
                    <span class="logo-suit">♥</span>
                </div>
                <p class="subtitle">Запись и рейтинг игроков</p>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="register">Регистрация</button>
            <button class="tab" data-tab="leaderboard">Рейтинг</button>
            <button class="tab" data-tab="profile">Профиль</button>
        </nav>

        <main class="content">
            <section id="tab-register" class="tab-content active">
                <div class="card">
                    <h2>Новый игрок</h2>
                    <form id="registerForm">
                        <div class="field">
                            <label for="nickname">Никнейм</label>
                            <input type="text" id="nickname" placeholder="Введите ник" required maxlength="20">
                        </div>
                        <div class="field">
                            <label for="phone">Номер телефона</label>
                            <input type="tel" id="phone" placeholder="+7 (999) 999-99-99" required>
                        </div>
                        <button type="submit" class="btn">Записаться</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Последние записи</h2>
                    <div id="recentPlayers" class="players-list">
                        <p class="empty-state">Пока нет игроков</p>
                    </div>
                </div>
            </section>

            <section id="tab-leaderboard" class="tab-content">
                <div class="card">
                    <div class="leaderboard-header">
                        <h2>Рейтинг игроков</h2>
                        <select id="sortBy" class="sort-select">
                            <option value="points">По очкам</option>
                            <option value="gamesPlayed">По играм</option>
                            <option value="winRate">По % побед</option>
                        </select>
                    </div>
                    <div id="leaderboardList" class="players-list">
                        <p class="empty-state">Нет данных для рейтинга</p>
                    </div>
                </div>

                <div class="card">
                    <h2>Записать результат игры</h2>
                    <form id="gameForm">
                        <div class="field">
                            <label>Выберите игроков (минимум 2)</label>
                            <div id="playersCheckboxes" class="checkboxes"></div>
                        </div>
                        <div class="field">
                            <label>Победитель</label>
                            <select id="winnerSelect" class="sort-select">
                                <option value="">-- выберите --</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-secondary">Записать игру</button>
                    </form>
                </div>
            </section>

            <section id="tab-profile" class="tab-content">
                <div class="card">
                    <div class="profile-header">
                        <div class="avatar">👤</div>
                        <div id="profileInfo">
                            <p class="profile-empty">Выберите игрока из рейтинга</p>
                        </div>
                    </div>
                </div>
                <div class="card" id="profileStats" style="display:none">
                    <h2>Статистика</h2>
                    <div class="stats-grid">
                        <div class="stat">
                            <span class="stat-value" id="statGames">0</span>
                            <span class="stat-label">Игр</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="statWins">0</span>
                            <span class="stat-label">Побед</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="statWinRate">0%</span>
                            <span class="stat-label">% побед</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="statPoints">0</span>
                            <span class="stat-label">Очки</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="toast" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
