<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Texas Poker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-bg"></div>
            <div class="header-content">
                <div class="logo">
                    <span class="suit">♠</span>
                    <h1>TEXAS POKER</h1>
                    <span class="suit">♥</span>
                </div>
                <p class="subtitle">Запись и рейтинг игроков</p>
            </div>
        </header>
        <nav class="tabs">
            <button class="tab active" data-tab="register">Регистрация</button>
            <button class="tab" data-tab="leaderboard">Рейтинг</button>
            <button class="tab" data-tab="games">Игры</button>
            <button class="tab" data-tab="admin">Админ</button>
        </nav>
        <main class="content">
            <section id="tab-register" class="tab-content active">
                <div class="card"><div class="card-title"><span class="icon">✚</span> Новый игрок</div>
                <form id="registerForm">
                    <div class="field"><label>Никнейм</label><input type="text" id="nickname" placeholder="Например: AceKing" maxlength="20" autocomplete="off"></div>
                    <div class="field"><label>Телефон</label><input type="tel" id="phone" placeholder="+7 (999) 999-99-99" autocomplete="off" maxlength="16"></div>
                    <button type="submit" class="btn">Записаться на игру</button>
                </form></div>
                <div class="card"><div class="card-title"><span class="icon">📋</span> Игроки на сегодня</div>
                <div id="todayPlayers"><div class="empty">Загрузка...</div></div>
                <div class="total-count" id="totalCount"></div></div>
            </section>
            <section id="tab-leaderboard" class="tab-content">
                <div class="card"><div class="card-flex"><div class="card-title">🏆 Рейтинг</div>
                <select id="sortBy" class="sel"><option value="points">По очкам</option><option value="gamesPlayed">По играм</option><option value="winRate">По % побед</option><option value="knockouts">По нокаутам</option></select></div>
                <div class="filter-row"><button class="filter-btn active" data-filter="all">Все</button><button class="filter-btn" data-filter="today">Сегодня</button><button class="filter-btn" data-filter="week">Неделя</button><button class="filter-btn" data-filter="month">Месяц</button></div>
                <div id="leaderboardList"><div class="empty">Загрузка...</div></div></div>
            </section>
            <section id="tab-games" class="tab-content">
                <div class="card"><div class="card-title">🎮 Записать игру</div>
                <form id="gameForm">
                    <div class="field"><label>Название игры</label><input type="text" id="gameName" placeholder="Например: Турнир #1" maxlength="50"></div>
                    <div class="field"><label>Участники (минимум 2)</label><div id="playersCheckboxes"></div></div>
                    <div class="field"><label>Победитель</label><select id="winnerSelect" class="sel"><option value="">— выберите —</option></select></div>
                    <div class="field" id="knockoutSection" style="display:none"><label>Нокауты (кто кого выбил)</label><div id="knockoutList"></div></div>
                    <button type="submit" class="btn btn-sec">Записать результат</button>
                </form></div>
                <div class="card"><div class="card-title">📜 История игр</div>
                <div id="gamesHistory"><div class="empty">Загрузка...</div></div></div>
            </section>
            <section id="tab-admin" class="tab-content">
                <div id="adminLogin"><div class="card"><div class="card-title">🔐 Администратор</div>
                <form id="adminForm"><div class="field"><label>Пароль</label><input type="password" id="adminPass" placeholder="Введите пароль"></div>
                <button type="submit" class="btn">Войти</button></form></div></div>
                <div id="adminPanel" style="display:none">
                <div class="card"><div class="card-flex"><div class="card-title">⚙️ Панель</div><button id="adminLogout" class="btn-sm">Выйти</button></div></div>
                <div class="card"><div class="card-title">👥 Все игроки с телефонами</div><div id="adminPlayers"></div></div>
                <div class="card"><div class="card-title">➕ Ребай</div>
                <form id="rebuyForm"><div class="field"><label>Игрок</label><select id="rebuyPlayer" class="sel"></select></div>
                <div class="field"><label>Сумма (₽)</label><input type="number" id="rebuyAmount" placeholder="500" min="0"></div>
                <button type="submit" class="btn btn-sec">Записать ребай</button></form></div>
                <div class="card"><div class="card-title">📊 Google Таблица</div>
                <button id="exportBtn" class="btn btn-sec">Открыть таблицу</button>
                <button id="syncBtn" class="btn btn-sec" style="margin-top:8px">🔄 Синхронизировать в таблицу</button></div></div>
            </section>
        </main>
        <div id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
