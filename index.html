<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Lounge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-bg"></div>
            <div class="header-content">
                <div class="logo">
                    <span class="logo-suit">♠</span>
                    <h1>Poker Lounge</h1>
                    <span class="logo-suit">♥</span>
                </div>
                <p class="subtitle">Запись и рейтинг игроков</p>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="register">Регистрация</button>
            <button class="tab" data-tab="leaderboard">Рейтинг</button>
            <button class="tab" data-tab="admin">Админ</button>
        </nav>

        <main class="content">
            <section id="tab-register" class="tab-content active">
                <div class="card">
                    <h2>Новый игрок</h2>
                    <form id="registerForm">
                        <div class="field">
                            <label for="nickname">Никнейм</label>
                            <input type="text" id="nickname" placeholder="Введите ник" required maxlength="20">
                        </div>
                        <div class="field">
                            <label for="phone">Номер телефона</label>
                            <input type="tel" id="phone" placeholder="+7 (999) 999-99-99" required>
                        </div>
                        <button type="submit" class="btn">Записаться</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Последние записи</h2>
                    <div id="recentPlayers" class="players-list">
                        <p class="empty-state">Загрузка...</p>
                    </div>
                </div>
            </section>

            <section id="tab-leaderboard" class="tab-content">
                <div class="card">
                    <div class="leaderboard-header">
                        <h2>Рейтинг игроков</h2>
                        <select id="sortBy" class="sort-select">
                            <option value="points">По очкам</option>
                            <option value="gamesPlayed">По играм</option>
                            <option value="winRate">По % побед</option>
                        </select>
                    </div>
                    <div id="leaderboardList" class="players-list">
                        <p class="empty-state">Загрузка...</p>
                    </div>
                </div>

                <div class="card">
                    <h2>Записать результат игры</h2>
                    <form id="gameForm">
                        <div class="field">
                            <label>Выберите игроков (минимум 2)</label>
                            <div id="playersCheckboxes" class="checkboxes"></div>
                        </div>
                        <div class="field">
                            <label>Победитель</label>
                            <select id="winnerSelect" class="sort-select">
                                <option value="">-- выберите --</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-secondary">Записать игру</button>
                    </form>
                </div>
            </section>

            <section id="tab-admin" class="tab-content">
                <div id="adminLoginPanel">
                    <div class="card">
                        <h2>Вход для администратора</h2>
                        <form id="adminLoginForm">
                            <div class="field">
                                <label>Пароль</label>
                                <input type="password" id="adminPassword" placeholder="Введите пароль">
                            </div>
                            <button type="submit" class="btn">Войти</button>
                        </form>
                    </div>
                </div>

                <div id="adminPanel" style="display:none">
                    <div class="card">
                        <div class="admin-header">
                            <h2>Панель администратора</h2>
                            <button id="adminLogout" class="btn-small">Выйти</button>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Все игроки (с телефонами)</h2>
                        <div id="adminPlayersList" class="players-list">
                            <p class="empty-state">Загрузка...</p>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Записать ребай</h2>
                        <form id="rebuyForm">
                            <div class="field">
                                <label>Игрок</label>
                                <select id="rebuyPlayer" class="sort-select">
                                    <option value="">-- выберите --</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>Сумма</label>
                                <input type="number" id="rebuyAmount" placeholder="Например: 500" min="0" step="50">
                            </div>
                            <button type="submit" class="btn btn-secondary">Записать ребай</button>
                        </form>
                    </div>

                    <div class="card">
                        <h2>Выгрузка данных</h2>
                        <button id="exportBtn" class="btn btn-secondary">Открыть Google Таблицу</button>
                    </div>
                </div>
            </section>
        </main>

        <div class="toast" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
